name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node sandbox/smoke-test.mjs
      - run: node sandbox/comprehensive-test.mjs
      - run: npm audit
      - run: npm pack --dry-run

  cleanup-merged-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Delete merged PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const defaultBranch = context.payload.repository.default_branch
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            })

            for (const pr of pulls) {
              if (!pr.merged_at) continue
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue
              if (!pr.head.ref || pr.head.ref === defaultBranch) continue

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${pr.head.ref}`,
                })
                core.info(`Deleted merged branch ${pr.head.ref}`)
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent: ${pr.head.ref}`)
                  continue
                }
                throw error
              }
            }
